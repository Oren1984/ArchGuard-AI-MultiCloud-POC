<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}ArchGuard{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; margin: 0; background: #f5f6f8; color: #1a1d23; }
    header { background: #14213d; color: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #fff; text-decoration: none; font-weight: 600; }
    main { padding: 24px; max-width: 1100px; margin: 0 auto; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; text-transform: uppercase; }
    .badge-low, .badge-passed, .badge-approved, .badge-inactive { background: #d7f5e1; color: #0b6b3a; }
    .badge-medium, .badge-warning, .badge-pending_approval { background: #fff2cc; color: #8a6d00; }
    .badge-high, .badge-active, .badge-blocked, .badge-rejected { background: #ffe1e1; color: #a30000; }
    .badge-critical, .badge-failed { background: #ff9a9a; color: #6a0000; }
    table { width: 100%; border-collapse: collapse; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; }
    th { background: #eef0f4; }
    .card { background: #fff; border-radius: 8px; padding: 16px 20px; margin-bottom: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card h2 { margin-top: 0; font-size: 16px; text-transform: uppercase; letter-spacing: .04em; color: #555; }
    .section-label { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: #888; margin-bottom: 6px; }
    .kv { display: grid; grid-template-columns: 200px 1fr; gap: 6px 12px; font-size: 14px; }
    .kv dt { color: #666; }
    .kv dd { margin: 0; }
    .kill-switch-banner { background: #ffe1e1; color: #a30000; padding: 10px 16px; font-weight: 600; text-align: center; }
    .tag-deterministic { border-left: 4px solid #2563eb; }
    .tag-ai { border-left: 4px solid #7c3aed; }
    .tag-evaluation { border-left: 4px solid #d97706; }
    .tag-human { border-left: 4px solid #16a34a; }
    .tag-simulated { border-left: 4px solid #64748b; }
    audit-item { display: block; }
    .mono { font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; }
  </style>
</head>
<body>
<header>
  <a href="/dashboard">ArchGuard AI MultiCloud POC</a>
  <span>Kill switch: <span class="badge badge-{{ kill_switch_state }}">{{ kill_switch_state }}</span></span>
</header>
{% if kill_switch_state == "active" %}
<div class="kill-switch-banner">KILL SWITCH ACTIVE — AI processing and simulated actions are blocked fail-closed.</div>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
